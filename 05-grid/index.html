<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Grid</h1>

  <h2>1. Equal columns</h2>
  <div class="grid-3">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
  </div>

  <h2>2. Responsive auto-fit grid</h2>
  <div class="grid-auto">
    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
    <div class="box">D</div>
  </div>

  <h2>3. Full page layout with areas</h2>
  <div class="layout">
    <header>Header</header>
    <nav>Sidebar</nav>
    <main>Main content</main>
    <footer>Footer</footer>
  </div>
</body>
</html>
