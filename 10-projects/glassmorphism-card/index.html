<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Blurred colorful shapes sit behind the glass -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <article class="glass-card">
    <div class="avatar">YN</div>
    <h1>Your Name</h1>
    <p class="role">Web Developer and Data Analyst</p>
    <p class="bio">Building clean, responsive websites and learning to turn data into decisions.</p>
    <div class="actions">
      <a href="https://github.com/your-username" class="btn primary">GitHub</a>
      <a href="mailto:you@example.com" class="btn ghost">Contact</a>
    </div>
  </article>
</body>
</html>
