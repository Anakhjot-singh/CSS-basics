<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="#" class="logo">Brand</a>

    <!-- Hamburger button: visible only on small screens -->
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>

    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact" class="cta">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="content">
    <h1>Responsive Navbar</h1>
    <p>On desktop the links sit in a row. On mobile they collapse behind the menu button.</p>
  </main>

  <script>
    // Show or hide the menu on small screens
    const toggle = document.getElementById("menuToggle");
    const links = document.getElementById("navLinks");
    toggle.addEventListener("click", function () {
      links.classList.toggle("open");
    });
  </script>
</body>
</html>
