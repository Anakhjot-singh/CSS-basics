<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line is essential for responsive design on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Design</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Responsive Design</h1>
    <p>Resize your browser window to see the layout change.</p>
  </header>

  <main class="container">
    <section class="grid">
      <article class="card">
        <img src="https://picsum.photos/400/250?1" alt="Sample 1">
        <h2>Card One</h2>
        <p>Cards go from 1 column on phones to 3 on desktops.</p>
      </article>
      <article class="card">
        <img src="https://picsum.photos/400/250?2" alt="Sample 2">
        <h2>Card Two</h2>
        <p>Images scale down with their container.</p>
      </article>
      <article class="card">
        <img src="https://picsum.photos/400/250?3" alt="Sample 3">
        <h2>Card Three</h2>
        <p>Fluid text sizes adapt to the screen.</p>
      </article>
    </section>
  </main>
</body>
</html>
