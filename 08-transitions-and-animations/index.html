<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transitions and Animations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Transitions and Animations</h1>

  <h2>1. Hover button</h2>
  <button class="btn">Hover me</button>

  <h2>2. Lifting card</h2>
  <div class="card">Hover over this card</div>

  <h2>3. Spinner</h2>
  <div class="spinner"></div>

  <h2>4. Pulse</h2>
  <div class="pulse">Pulse</div>

  <h2>5. Fade in on load</h2>
  <p class="fade-in">I fade in and slide up when the page loads.</p>
</body>
</html>
